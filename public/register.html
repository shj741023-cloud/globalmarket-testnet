<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#132a22">
  <title>상품 등록 | Global Market</title>
  <link rel="stylesheet" href="/styles.css?v=20260823-1">
  <link rel="stylesheet" href="/management.css?v=20260828-5">
</head>
<body class="register-page-body">
  <header class="topbar register-topbar"><button id="backToMarket" class="topbar-brand" type="button">← Global Market</button><span class="network">Test-Pi 전용</span></header>
  <main class="register-page">
    <section class="panel register-page-panel">
      <div class="section-title"><div><p class="eyebrow">테스트 상품 판매</p><h1>중고상품 등록</h1></div></div>
      <p class="form-notice">개인 소유 실물 중고품만 등록할 수 있습니다.</p>
      <form id="standaloneProductForm" class="product-form">
        <label for="standaloneTitle">상품명</label>
        <input id="standaloneTitle" minlength="2" maxlength="80" autocomplete="off" required>
        <label for="standaloneDescription">설명</label>
        <textarea id="standaloneDescription" minlength="10" maxlength="2000" required></textarea>
        <div class="photo-actions">
          <strong>상품 사진(최대 3장)</strong>
          <div class="photo-buttons">
            <label class="secondary photo-picker">사진 선택<input id="standaloneImages" type="file" accept="image/*" multiple></label>
            <label class="secondary photo-picker">카메라 촬영<input id="standaloneCamera" type="file" accept="image/*" capture="environment"></label>
          </div>
          <small>사진은 자동으로 축소되며 첫 번째 사진이 대표사진입니다.</small>
        </div>
        <div id="standalonePreview" class="image-editor" aria-live="polite"></div>
        <div class="form-row"><label>가격(Test-Pi)<input id="standalonePrice" type="number" min="0.000001" step="any" required></label><label>카테고리<select id="standaloneCategory" required><option value="">불러오는 중</option></select></label></div>
        <label>거래 지역<input id="standaloneRegion" maxlength="60" placeholder="예: 서울 강남구"></label>
        <label>직거래 정산 지갑주소<input id="standaloneWallet" maxlength="56" placeholder="G로 시작하는 56자리 Pi 지갑주소"><small>직거래를 선택할 때만 필수입니다.</small></label>
        <fieldset><legend>거래방식</legend><label class="check"><input id="standaloneDirect" type="checkbox" checked> 직거래</label><label class="check"><input id="standaloneParcel" type="checkbox" checked> Testnet 택배</label></fieldset>
        <button class="primary" type="submit">시험 상품 등록</button>
        <p id="standaloneResult" class="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="/register.js?v=20260828-1"></script>
</body>
</html>
